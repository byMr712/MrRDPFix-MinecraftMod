plugins {
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty('yarn_mappings') && !project.property('yarn_mappings').toString().trim().isEmpty()) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    } else {
        mappings files("empty-mappings.jar")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}.jar"
}

sourceSets {
    neoforge {
        java {
            srcDirs = ['src/neoforge/java']
        }
        resources {
            srcDirs = ['src/neoforge/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

processNeoforgeResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

task jarNeoForge(type: Jar) {
    dependsOn compileNeoforgeJava, processNeoforgeResources
    archiveFileName = "MrTrueRdpFix-NeoForge-${project.minecraft_version}-byMr712-v${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude "kesslercascade/rdpmouse/RDPMousePreLaunch.class"
        exclude "fabric.mod.json"
    }
    from(sourceSets.neoforge.output) {
        exclude "net/neoforged/**"
    }
    from("src/main/resources") {
        include "assets/**"
        include "natives/**"
    }
    from("LICENSE")
    from("NOTICE.md")
}

build.dependsOn(jarNeoForge)

def allBuildsDir = file("C:/Users/Mr712/Documents/RDPMouse_all_builds")
tasks.register('copyToAllBuilds', Copy) {
    dependsOn remapJar, jarNeoForge
    from remapJar.archiveFile
    from jarNeoForge.archiveFile
    into allBuildsDir
    doLast {
        println ">>> Copied ${remapJar.archiveFileName.get()} and ${jarNeoForge.archiveFileName.get()} to ${allBuildsDir.absolutePath}!"
    }
}

build.finalizedBy(copyToAllBuilds)

def launcherModsDir = file("E:/ATLauncher/instances/FabulouslyOptimizedFPStest1214/mods")
if (launcherModsDir.exists() && project.minecraft_version == '1.21.4') {
    tasks.register('copyToLauncher', Copy) {
        dependsOn remapJar
        from remapJar.archiveFile
        into launcherModsDir
        doLast {
            println ">>> Copied ${remapJar.archiveFileName.get()} to ATLauncher instance mods folder!"
        }
    }
    build.finalizedBy(copyToLauncher)
}
