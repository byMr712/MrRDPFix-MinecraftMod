plugins {
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/rdpmouse.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty('yarn_mappings') && !project.property('yarn_mappings').toString().trim().isEmpty()) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    } else {
        mappings files("empty-mappings.jar")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    def fabricApi = project.findProperty('fabric_api_version') ?: project.findProperty('fabric_version')
    if (fabricApi) {
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }

    if (project.hasProperty('modmenu_version') && !project.property('modmenu_version').toString().trim().isEmpty()) {
        modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = project.minecraft_version.startsWith('26') ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}.jar"
}

def allBuildsDir = file("C:/Users/Mr712/Documents/RDPMouse_all_builds")
tasks.register('copyToAllBuilds', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into allBuildsDir
    doLast {
        println ">>> Copied ${remapJar.archiveFileName.get()} to ${allBuildsDir.absolutePath}!"
    }
}

build.finalizedBy(copyToAllBuilds)

def launcherModsDir = file("E:/ATLauncher/instances/FabulouslyOptimizedFPStest1214/mods")
if (launcherModsDir.exists() && project.minecraft_version == '1.21.4') {
    tasks.register('copyToLauncher', Copy) {
        dependsOn remapJar
        from remapJar.archiveFile
        into launcherModsDir
        doLast {
            println ">>> Copied ${remapJar.archiveFileName.get()} to ATLauncher instance mods folder!"
        }
    }
    build.finalizedBy(copyToLauncher)
}
